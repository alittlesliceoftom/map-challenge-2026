# Settings for the website. Edit freely, then run `python build.py`.
# (Written by setup_challenge.py: run it again any time to redo these answers.)

name = "asliceoftom"                 # shown top-right on the calendar
made_by_url = "https://asliceoftom.com" # your name links here (calendar + footer)
made_with = ""                       # optional, after your name in the footer
title_top = "30 Maps"                # big headline, line 1
title_bottom = "30 Days"             # big headline, line 2 (highlighted)
intro = "#30DayMapChallenge, November 2026. One map a day, built in Python."

year = 2026
month = 11                           # November

challenge_url = "https://30daymapchallenge.com/"

# The site's own web address, once it has one (e.g. "https://example.com/maps").
# Used so links shared on social media show the map's preview image.
site_url = "https://asliceoftom.com/projects/map-challenge-2026"

# Links shown in the footer. Leave the url empty to hide one.
links = [
  { label = "Website", url = "https://asliceoftom.com" },
  { label = "GitHub", url = "https://github.com/alittlesliceoftom" }
]

# The template this site is built from: it's credited in the footer.
# Please keep it. Thank you!
[template]
by = "Edita Chavez"
url = "https://editachavez.com/"
repo = "https://github.com/edichavezz/map-challenge-template"
