# Where does the data come from? One [[source]] block per dataset.

[[source]]
name = "Streets, pedestrian areas and buildings around Waterloo Bridge"
url = "https://www.openstreetmap.org/#map=17/51.5090/-0.1180"
from = "OpenStreetMap contributors (via the Overpass API, using osmnx); query described in query.md"
what = "About 2,700 street features (every highway=* way and pedestrian area) and their buildings, between Waterloo station and Covent Garden; turned into a walkable area by buffering each street by a width from its type and removing buildings"
time = "OpenStreetMap as of 8 Nov 2026; downloaded 8 Nov 2026"
resolution = "OSM street centrelines (~1–5 m); street widths are estimates by street type (e.g. 10 m either side of a main road), not surveyed kerb lines"
licence = "ODbL, © OpenStreetMap contributors (credited on the map)"

[[source]]
name = "Basemap and 3D buildings"
url = "https://openfreemap.org/"
from = "OpenFreeMap (Liberty style), built on OpenMapTiles from OpenStreetMap data"
what = "Vector tiles for the background map, including building heights used for the 3D buildings"
time = "Tiles as served when the page is viewed"
resolution = "Vector tiles; building heights from OSM tags where present, otherwise estimated"
licence = "OpenFreeMap and OpenMapTiles: BSD/CC-BY; data ODbL, © OpenStreetMap contributors (credited on the map)"

[[source]]
name = "Walking figure (CesiumMan)"
url = "https://github.com/KhronosGroup/glTF-Sample-Assets/tree/main/Models/CesiumMan"
from = "Cesium, published in the Khronos glTF Sample Assets"
what = "One animated 3D model of a walking person, reused for every walker at street zoom"
time = "Model © 2017; pinned to commit 8f492390 of the sample assets repo"
resolution = "Low-poly model, drawn about twice life size so people stay visible"
licence = "CC BY 4.0, © 2017 Cesium; the Cesium logo on the texture is a Cesium trademark"

[[source]]
name = "People, bikes and buses (synthetic)"
url = "https://github.com/alittlesliceoftom/map-challenge-2026/tree/main/days/08-utopia"
from = "Generated in map.py (agents.py)"
what = "1,200 walkers, 90 cyclists and 12 buses per 7-minute cycle. Walkers follow the streets but wander across the full width; cyclists and buses share one central lane; buses run as signalled one-way convoys. Illustrative, not counts"
time = "Generated 8 Nov 2026 (random seed 8)"
resolution = "Imagined: positions are made up to look plausible, not measured"
licence = "My own; no third-party licence"
